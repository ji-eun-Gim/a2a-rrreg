version: "3.9"

services:
  app:
    build: .
    command: gunicorn -b 0.0.0.0:3000 app.main:app
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
      JWT_REDIS_URL: redis://redis:6379/0
      PORT: "3000"
      # jwt-server 가 호스트/다른 Compose 에서 돌아갈 때 userme 엔드포인트
      USERME_DIRECT_URL: ${USERME_DIRECT_URL:-http://host.docker.internal:8000/users/me}
    volumes:
      - app_data:/app/data
    depends_on:
      - redis
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  app_data:
  redis_data:
