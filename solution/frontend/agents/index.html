<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>A2A Security Dashboard - Agents</title>
    <link rel="stylesheet" href="../style.css" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=add" />
  </head>
  <body>
    <div class="app-container">
      <header class="app-header">
        <div class="logo">A2A SECURE</div>
        <nav class="main-nav">
          <a href="/" class="nav-link">Dashboard</a>
          <a href="/agents" class="nav-link active">Agents</a>
          <a href="/logs" class="nav-link">Logs</a>
          <a href="/ruleset" class="nav-link">Ruleset</a>
        </nav>
      </header>

      <main class="content-area">
        <section id="agents" class="content-page active">
          <div class="widget widget-agent-list">
            <div class="widget-title-row">
              <h3 class="widget-title">에이전트 리스트 (List)</h3>
              <button id="add-agent-btn" class="btn btn-primary icon-only" title="에이전트 카드 추가">
                <span class="material-symbols-outlined">add</span>
              </button>
            </div>
            <div class="agent-list-container" id="agent-list"></div>
          </div>

          <div class="widget widget-registry-log">
            <div class="widget-title-row">
              <h3 class="widget-title">레지스트리 로그 (추가/삭제)</h3>
            </div>
            <ul class="threat-list" id="registry-log"></ul>
          </div>

          <div class="widget widget-agent-details">
            <div class="widget-title-row" style="display:flex;align-items:center;justify-content:space-between;gap:8px;">
              <h3 class="widget-title" style="margin:0;">선택한 에이전트 상세 정보</h3>
              <div style="display:flex;gap:8px;">
                <button id="edit-agent-btn" class="btn" disabled>수정</button>
                <button id="delete-agent-btn" class="btn btn-danger" disabled>삭제</button>
              </div>
            </div>
            <pre id="agent-details-json" class="agent-details-json" style="white-space: pre-wrap; color: var(--text-secondary); max-height: 50vh; overflow: auto;">[ 에이전트 리스트에서 항목을 클릭하면 상세 정보가 표시됩니다 ]</pre>
          </div>
        </section>
      </main>
    </div>

    <script>
      document.addEventListener('DOMContentLoaded', () => {
        const listEl = document.getElementById('agent-list');
        const logEl = document.getElementById('registry-log');
        const detailsEl = document.getElementById('agent-details-json');
        const addBtn = document.getElementById('add-agent-btn');
        const editBtn = document.getElementById('edit-agent-btn');
        const deleteBtn = document.getElementById('delete-agent-btn');

        let selectedCard = null;
        let selectedAgent = null;

        function renderAgent(name, status) {
          const item = document.createElement('div');
          item.className = 'agent-list-item';
          const strong = document.createElement('strong');
          strong.textContent = name || 'Unknown';
          const badge = document.createElement('span');
          const st = (status || 'Active');
          const isDeleted = st.toLowerCase() === 'deleted';
          badge.className = isDeleted ? 'status-disabled' : 'status-active';
          badge.textContent = st;
          if (isDeleted) {
            item.style.opacity = '0.65';
          }
          item.appendChild(strong);
          item.appendChild(badge);
          return item;
        }

        function renderLog(entry) {
          const li = document.createElement('li');
          li.className = 'threat-item ' + (entry.ok ? 'log-success' : 'log-error');
          const t = entry.timeText || (entry.timeIso ? new Date(entry.timeIso).toLocaleTimeString('ko-KR', { hour12: false }) : '');
          li.textContent = `${entry.message || ''} (${t})`;
          return li;
        }

        async function loadAgents() {
          try {
            const res = await fetch('/api/agents');
            const data = await res.json();
            if (Array.isArray(data.agents)) {
              listEl.innerHTML = '';
              data.agents.forEach(a => {
                const name = (a && a.card && a.card.name) || a.name || 'Unknown';
                const status = a && a.status ? a.status : 'Active';
                const item = renderAgent(name, status);
                item.addEventListener('click', () => {
                  const card = a && a.card ? a.card : { name, status };
                  if (detailsEl) {
                    try {
                      detailsEl.textContent = JSON.stringify(card, null, 2);
                    } catch {
                      detailsEl.textContent = String(card);
                    }
                    // Ensure the details panel shows from the top
                    try { detailsEl.scrollTop = 0; } catch {}
                  }
                  selectedCard = card;
                  selectedAgent = a;
                  if (editBtn) editBtn.disabled = false;
                  if (deleteBtn) deleteBtn.disabled = false;
                });
                listEl.appendChild(item);
              });
            }
          } catch {}
        }

        async function loadLogs() {
          try {
            const res = await fetch('/api/logs');
            const data = await res.json();
            if (Array.isArray(data.logs)) {
              logEl.innerHTML = '';
              data.logs.forEach(l => logEl.appendChild(renderLog(l)));
            }
          } catch {}
        }

        function refreshAll() { loadAgents(); loadLogs(); }

        function openAgentModal(token, initialCard) {
          const overlay = document.createElement('div');
          overlay.style.position = 'fixed';
          overlay.style.inset = '0';
          overlay.style.background = 'rgba(0,0,0,0.6)';
          overlay.style.display = 'grid';
          overlay.style.placeItems = 'center';
          overlay.style.zIndex = '9999';

          const modal = document.createElement('div');
          modal.style.width = 'min(800px, 92vw)';
          modal.style.maxHeight = '80vh';
          modal.style.overflow = 'auto';
          modal.style.background = 'var(--bg-dark-secondary, #1e1e3f)';
          modal.style.border = '1px solid var(--border-color, #3a3a5f)';
          modal.style.borderRadius = '10px';
          modal.style.boxShadow = '0 10px 30px rgba(0,0,0,0.35)';
          modal.style.padding = '16px';
          modal.style.color = 'var(--text-primary, #f0f0f5)';

          const template = {
            protocolVersion: '1.0',
            name: 'My Agent',
            description: 'Custom agent',
            url: 'http://localhost:1234',
            preferredTransport: 'http',
            version: '0.1.0',
            capabilities: {},
            defaultInputModes: ['text'],
            defaultOutputModes: ['text'],
            skills: ['basic']
          };

          // Remove fields we do not want users to edit directly (e.g., signatures)
          const sanitizeCard = (c) => {
            try {
              const copy = JSON.parse(JSON.stringify(c));
              if (copy && typeof copy === 'object') {
                delete copy.signatures;
              }
              return copy;
            } catch { return c; }
          };

          const initial = initialCard && typeof initialCard === 'object' ? sanitizeCard(initialCard) : template;

          modal.innerHTML = `
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;border-bottom:1px solid var(--border-color,#3a3a5f);padding-bottom:8px;">
              <h3 style="margin:0;">에이전트 카드 ${initialCard ? '수정' : '추가'}</h3>
              <button id="agent-modal-close" class="btn" style="min-width:72px;">닫기</button>
            </div>
            <div style="font-size:0.9rem;color:var(--text-secondary,#aab);margin-bottom:8px;">필수 필드를 포함한 카드 JSON을 입력하세요.</div>
            <textarea id="agent-card-json" style="width:100%;height:320px;background:#0b0f14;color:#e7ecf2;border:1px solid var(--border-color,#3a3a5f);border-radius:8px;padding:10px;white-space:pre;">${JSON.stringify(initial, null, 2)}</textarea>
            <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:12px;">
              <button id="agent-modal-submit" class="btn btn-primary">${initialCard ? '저장' : '추가'}</button>
            </div>
          `;

          overlay.appendChild(modal);
          document.body.appendChild(overlay);

          function close() { overlay.remove(); }
          modal.querySelector('#agent-modal-close')?.addEventListener('click', close);
          modal.querySelector('#agent-modal-submit')?.addEventListener('click', async () => {
            const ta = modal.querySelector('#agent-card-json');
            if (!(ta instanceof HTMLTextAreaElement)) return;
            try {
              const endpoint = initialCard ? '/api/update-agent' : '/api/create-agent';
              await fetch(endpoint, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Accept': 'application/json', 'Authorization': 'Bearer ' + token },
                body: ta.value
              });
            } catch { /* ignore network errors for UI flow */ }
            // Always close and refresh regardless of result
            close();
            try { if (window.opener && !window.opener.closed) window.opener.location.reload(); else window.location.reload(); } catch(_) {}
          });
        }

        addBtn?.addEventListener('click', async () => {
          const token = prompt('JWT 토큰을 입력하세요');
          if (!token) return;
          try {
            const res = await fetch('/api/verify-admin', { method: 'GET', headers: { Authorization: 'Bearer ' + token, Accept: 'application/json' } });
            if (res.ok) {
              // 성공 시 에이전트 카드 입력 모달 열기
              openAgentModal(token);
            } else {
              // 실패 시 에러 모달/메시지 없이 즉시 새로고침
              try { if (window.opener && !window.opener.closed) window.opener.location.reload(); else window.location.reload(); } catch(_) {}
            }
          } catch {
            // 네트워크 오류 등도 에러 표시 없이 리프레시
            try { if (window.opener && !window.opener.closed) window.opener.location.reload(); else window.location.reload(); } catch(_) {}
          }
        });

        // Edit button flow
        editBtn?.addEventListener('click', async () => {
          if (!selectedCard) return;
          const token = prompt('JWT 토큰을 입력하세요');
          if (!token) return;
          try {
            const res = await fetch('/api/verify-admin', { method: 'GET', headers: { Authorization: 'Bearer ' + token, Accept: 'application/json' } });
            if (res.ok) openAgentModal(token, selectedCard);
            else {
              try { if (window.opener && !window.opener.closed) window.opener.location.reload(); else window.location.reload(); } catch(_) {}
            }
          } catch {
            try { if (window.opener && !window.opener.closed) window.opener.location.reload(); else window.location.reload(); } catch(_) {}
          }
        });

        // Delete button flow
        deleteBtn?.addEventListener('click', async () => {
          if (!selectedAgent) return;
          const confirmDel = confirm('선택한 에이전트를 삭제하시겠습니까?');
          if (!confirmDel) return;
          const token = prompt('JWT 토큰을 입력하세요');
          if (!token) return;
          try {
            const res = await fetch('/api/verify-admin', { method: 'GET', headers: { Authorization: 'Bearer ' + token, Accept: 'application/json' } });
            if (!res.ok) {
              try { if (window.opener && !window.opener.closed) window.opener.location.reload(); else window.location.reload(); } catch(_) {}
              return;
            }
            const payload = selectedAgent && selectedAgent.agent_id
              ? { agent_id: selectedAgent.agent_id }
              : (selectedCard ? { card: selectedCard } : {});
            await fetch('/api/delete-agent', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json', 'Accept': 'application/json', 'Authorization': 'Bearer ' + token },
              body: JSON.stringify(payload)
            });
          } catch {}
          try { if (window.opener && !window.opener.closed) window.opener.location.reload(); else window.location.reload(); } catch(_) {}
        });

        // initial load
        refreshAll();
      });
    </script>
  </body>
</html>
