<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>A2A Security Dashboard - Logs</title>
    <link rel="stylesheet" href="../style.css" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=refresh,add" />
  </head>
  <body>
    <div class="app-container">
      <header class="app-header">
        <div class="logo">A2A SECURE</div>
        <nav class="main-nav">
          <a href="/" class="nav-link">Dashboard</a>
          <a href="/agents" class="nav-link">Agents</a>
          <a href="/logs" class="nav-link active">Logs</a>
          <a href="/ruleset" class="nav-link">Ruleset</a>
        </nav>
      </header>

      <main class="content-area">
        <section id="logs" class="content-page active">
          <div class="widget widget-log-filter">
            <div class="widget-title-row">
              <h3 class="widget-title">濡쒓렇 ?꾪꽣</h3>
              <button class="btn icon-only" title="?덈줈怨좎묠" id="logs-refresh-btn">
                <span class="material-symbols-outlined">refresh</span>
              </button>
            </div>
            <div style="color: var(--text-secondary)">[ 湲곌컙/?먯씠?꾪듃 ID ?꾪꽣 ?곸뿭 ]</div>
          </div>

          <div class="widget widget-log-list">
            <div class="widget-title-row">
              <h3 class="widget-title">?꾩껜 濡쒓렇 由ъ뒪??(Table)</h3>
            </div>
            <table class="log-table">
              <thead>
                <tr>
                  <th>Time</th>
                  <th>Message</th>
                  <th>Status</th>
                </tr>
              </thead>
              <tbody id="logs-tbody"></tbody>
            </table>
          </div>

          <div class="widget widget-log-details">
            <div class="widget-title-row">
              <h3 class="widget-title">濡쒓렇 ?곸꽭 ?곸뿭</h3>
            </div>
            <div style="color: var(--text-secondary)">[ 濡쒓렇 ??ぉ ?대┃ ???곸꽭 ?뺣낫 ?쒖떆 ]</div>
          </div>
        </section>
      </main>
    </div>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const tbody = document.getElementById('logs-tbody');
      const btn = document.getElementById('logs-refresh-btn');

      function statusText(ok){ return ok ? 'OK' : 'Error'; }
      function timeText(entry){
        if (entry.timeText) return entry.timeText;
        if (entry.timeIso) {
          try { return new Date(entry.timeIso).toLocaleTimeString('ko-KR', { hour12: false }); } catch { return ''; }
        }
        return '';
      }
      function renderRow(entry){
        const tr = document.createElement('tr');
        const tdT = document.createElement('td'); tdT.textContent = timeText(entry);
        const tdM = document.createElement('td'); tdM.textContent = entry.message || '';
        const tdS = document.createElement('td'); tdS.textContent = statusText(entry.ok); tdS.style.color = entry.ok ? '#4dff4d' : 'var(--critical-red)';
        tr.appendChild(tdT); tr.appendChild(tdM); tr.appendChild(tdS);
        return tr;
      }
      async function loadLogs(){
        try{
          const res = await fetch('/api/logs');
          const data = await res.json();
          tbody.innerHTML = '';
          (data.logs || []).forEach(e => tbody.appendChild(renderRow(e)));
        }catch(e){ /* ignore */ }
      }
      btn?.addEventListener('click', loadLogs);
      loadLogs();
    });
  </script>
  </body>
  </html>
