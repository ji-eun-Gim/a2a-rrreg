[project]
name = "a2a-solution"
version = "0.1.0"
description = "A2A Solution Flask server"
requires-python = ">=3.11"
dependencies = [
  "flask>=2.3",
  "requests>=2.31",
  "gunicorn>=21.2",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

