[project]
name = "a2a-agent-registry"
version = "0.1.0"
description = "A2A Agent Card Registry server"
requires-python = ">=3.11"
dependencies = [
  "flask>=2.3",
  "redis>=5.0",
  "flask-limiter>=3.5",
  "ulid-py>=1.1",
  "jsonschema>=4.21",
  "requests>=2.31",
  "gunicorn>=21.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "fakeredis>=2.21",
  "black>=24.3.0",
  "ruff>=0.3.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
select = ["E", "F", "I"]
